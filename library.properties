name=Crowpanel_2.1
version=1.2.0
author=Charles Vaillancourt
maintainer=Charles Vaillancourt
sentence=Helper functions to work with a CrowPanel 2.1 LCD display
paragraph=This library contains a class that encapsulates all the functions of a Crowpanel 2.1 display including functions to receive events from the rotary encoder (rotation, click, double-click, long press), and to receive events from the touchscreen. It also allows setting the brightness of the LCD display, turning it OFF and ON, and setting the intensity of the LED.
category=Display
url=https://github.com/placidanomaly/Crowpanel_2.1
architectures=*
includes=crowpanel_2_1.h
depends=lvgl (>=9.5.0), PCF8574 library, Adafruit CST8XX Library (>=1.0.1), GFX Library for Arduino (>=1.4.7), Adafruit BusIO (>=1.16.1)
