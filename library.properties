name=Crowpanel_2.1
version=1.0.0
author=Charles Vaillancourt
maintainer=Charles Vaillancourt
sentence=Helper functions to work with a CrowPanel 2.1 LCD display
paragraph=This library contains a class that encapsulates all the functions of a Crowpanel 2.1 display including functions to receive events from the rotary encoder, including rotation, clicks, and long press, and to receive events from the touchscreen. It also allows setting the brightness of the LCD display, turning it OFF and ON, and setting the intensity of the LED.
